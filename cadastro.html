<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — Grey Barber</title>
  <meta name="description" content="Crie sua conta na Grey Barber e agende online.">
  <meta name="theme-color" content="#0b0b0c">
  <meta property="og:title" content="Criar conta — Grey Barber">
  <meta property="og:description" content="Crie sua conta na Grey Barber e agende online.">
  <meta property="og:image" content="img/barbearia-800.webp">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600;700&family=Rye&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="estilizacoes/base.css">
  <link rel="stylesheet" href="estilizacoes/paginas.css">
  <script src="js/config.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/banco-demo.js" defer></script>
  <script src="js/banco-supabase.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/remarcar.js" defer></script>
  <script src="js/paginas/cadastro.js" defer></script>
</head>
<body data-pagina="cadastro" class="pagina-auth">
  <main id="conteudo" class="auth">
    <div class="auth-arte" aria-hidden="true">
      <img src="img/barbeiro.webp" alt="">
      <div class="auth-arte-texto">
        <span class="sobretitulo">Grey Barber</span>
        <p>Tradição e estilo em cada detalhe.</p>
      </div>
    </div>
    <div class="auth-lado">
      <a href="index.html" class="auth-voltar"><i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar ao site</a>
      <form class="auth-form" id="form-cadastro" novalidate>
        <img src="img/logo-192.webp" alt="" class="auth-logo" width="72" height="78">
        <h1>Criar conta</h1>
        <p class="texto-suave">Leva 30 segundos e você acompanha todos os seus horários.</p>
        <div id="msg" class="oculto" role="alert"></div>
        <div class="campo">
          <label for="nome">Nome completo</label>
          <div class="com-icone"><i class="bi bi-person" aria-hidden="true"></i>
            <input id="nome" class="entrada" autocomplete="name" required minlength="2" maxlength="120" placeholder="Seu nome"></div>
          <span class="erro-campo" id="erro-nome"></span>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <div class="com-icone"><i class="bi bi-envelope" aria-hidden="true"></i>
            <input id="email" type="email" class="entrada" autocomplete="email" required placeholder="voce@email.com"></div>
          <span class="erro-campo" id="erro-email"></span>
        </div>
        <div class="campo">
          <label for="telefone">Celular / WhatsApp</label>
          <div class="com-icone"><i class="bi bi-phone" aria-hidden="true"></i>
            <input id="telefone" type="tel" inputmode="numeric" class="entrada" autocomplete="tel-national" required placeholder="(16) 99999-9999"></div>
          <span class="erro-campo" id="erro-telefone"></span>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <div class="com-icone"><i class="bi bi-lock" aria-hidden="true"></i>
            <input id="senha" type="password" class="entrada" autocomplete="new-password" required minlength="6" placeholder="Mínimo 6 caracteres">
            <button type="button" class="ver-senha" aria-label="Mostrar senha"><i class="bi bi-eye"></i></button></div>
          <span class="erro-campo" id="erro-senha"></span>
        </div>
        <div class="campo">
          <label for="senha2">Confirmar senha</label>
          <div class="com-icone"><i class="bi bi-lock-fill" aria-hidden="true"></i>
            <input id="senha2" type="password" class="entrada" autocomplete="new-password" required placeholder="Repita a senha"></div>
          <span class="erro-campo" id="erro-senha2"></span>
        </div>
        <button type="submit" class="btn btn-primario btn-bloco">Criar conta</button>
        <p class="auth-rodape">Já tem conta? <a href="login.html" id="link-login">Entrar</a></p>
      </form>
    </div>
  </main>
</body>
</html>
