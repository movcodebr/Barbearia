<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Grey Barber</title>
  <meta name="description" content="Entre na sua conta Grey Barber para agendar e acompanhar seus horários.">
  <meta name="theme-color" content="#0b0b0c">
  <meta property="og:title" content="Entrar — Grey Barber">
  <meta property="og:description" content="Entre na sua conta Grey Barber para agendar e acompanhar seus horários.">
  <meta property="og:image" content="img/barbearia-800.webp">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600;700&family=Rye&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="estilizacoes/base.css">
  <link rel="stylesheet" href="estilizacoes/paginas.css">
  <script src="js/config.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/banco-demo.js" defer></script>
  <script src="js/banco-supabase.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/remarcar.js" defer></script>
  <script src="js/paginas/login.js" defer></script>
</head>
<body data-pagina="login" class="pagina-auth">
  <main id="conteudo" class="auth">
    <div class="auth-arte" aria-hidden="true">
      <img src="img/barbeiro.webp" alt="">
      <div class="auth-arte-texto">
        <span class="sobretitulo">Grey Barber</span>
        <p>Tradição e estilo em cada detalhe.</p>
      </div>
    </div>
    <div class="auth-lado">
      <a href="index.html" class="auth-voltar"><i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar ao site</a>
      <form class="auth-form" id="form-login" novalidate>
        <img src="img/logo-192.webp" alt="" class="auth-logo" width="72" height="78">
        <h1>Entrar</h1>
        <p class="texto-suave">Clientes e funcionários entram por aqui.</p>
        <div id="msg" class="oculto" role="alert"></div>
        <div class="campo">
          <label for="email">E-mail</label>
          <div class="com-icone"><i class="bi bi-envelope" aria-hidden="true"></i>
            <input id="email" type="email" class="entrada" autocomplete="email" required placeholder="voce@email.com"></div>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <div class="com-icone"><i class="bi bi-lock" aria-hidden="true"></i>
            <input id="senha" type="password" class="entrada" autocomplete="current-password" required minlength="6" placeholder="Sua senha">
            <button type="button" class="ver-senha" aria-label="Mostrar senha"><i class="bi bi-eye"></i></button></div>
        </div>
        <div class="auth-linha"><a href="senha.html">Esqueci a senha</a></div>
        <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
        <p class="auth-rodape">Não tem conta? <a href="cadastro.html" id="link-cadastro">Cadastre-se</a></p>
        <div id="dica-demo" class="caixa-info oculto"></div>
      </form>
    </div>
  </main>
</body>
</html>
